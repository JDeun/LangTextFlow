[package]
name = "langtextflow-desktop"
version = "0.12.0"
description = "LangTextFlow desktop shell"
authors = ["LangTextFlow contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "langtextflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = "=2.11.5"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-updater = "=2.11.0"
