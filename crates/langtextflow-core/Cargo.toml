[package]
name = "langtextflow-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
time = { version = "=0.3.55", features = ["formatting"] }
getrandom = "=0.4.3"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
