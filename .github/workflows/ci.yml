name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade packaging bootstrap tools
        run: python -m pip install --upgrade "pip>=26" "setuptools>=83" wheel
      - run: pip install -e '.[dev]'
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Repository hygiene scan
        run: python scripts/repo_hygiene.py
      - name: Python lint
        run: ruff check apps/server scripts
      - name: Backend tests and coverage gate
        run: >-
          pytest --strict-config --strict-markers
          --cov=apps/server/langtextflow
          --cov-report=term-missing
          --cov-fail-under=60
      - name: Python dependency vulnerability audit
        run: pip-audit
      - name: Python static security scan
        run: bandit -r apps/server/langtextflow -ll

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Upload generated lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
