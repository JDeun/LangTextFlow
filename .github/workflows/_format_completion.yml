name: Format completion pass

on:
  push:
    branches: [feat/code-completion-pass]
    paths:
      - ".github/workflows/_format_completion.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/code-completion-pass
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.7"
      - name: Fix and format product Python
        run: |
          ruff check --fix \
            apps/server/langtextflow/main.py \
            apps/server/langtextflow/model_setup.py \
            apps/server/langtextflow/runtime_install.py \
            apps/server/langtextflow/vibevoice_lifecycle.py \
            apps/server/tests/test_runtime_install.py \
            apps/server/tests/test_model_cache.py \
            apps/server/tests/test_glossary_recommendations.py \
            apps/server/tests/test_lifecycle_soak.py \
            scripts/build_desktop_sidecar.py \
            scripts/render_tauri_release_config.py
          ruff format \
            apps/server/langtextflow/main.py \
            apps/server/langtextflow/model_setup.py \
            apps/server/langtextflow/runtime_install.py \
            apps/server/langtextflow/vibevoice_lifecycle.py \
            apps/server/tests/test_runtime_install.py \
            apps/server/tests/test_model_cache.py \
            apps/server/tests/test_glossary_recommendations.py \
            apps/server/tests/test_lifecycle_soak.py \
            scripts/build_desktop_sidecar.py \
            scripts/render_tauri_release_config.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server scripts/build_desktop_sidecar.py scripts/render_tauri_release_config.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize completion pass python"
          git push origin HEAD:feat/code-completion-pass
