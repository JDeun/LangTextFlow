name: CPU model candidate license and glossary gates

run-name: ltf-stage-catalog source=${{ inputs.source_sha || github.sha }}

on:
  pull_request:
    paths:
      - "benchmarks/ko_en_ja_model_candidates.v1.json"
      - "scripts/check_model_candidate_catalog.py"
      - "apps/server/tests/test_model_candidate_catalog.py"
      - ".github/workflows/cpu-model-candidate-gates.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen model and benchmark implementation revision
        type: string
        required: false
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false

permissions:
  contents: read

jobs:
  metadata-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate legal and experiment metadata, no model downloads
        run: |
          set -euo pipefail
          python scripts/check_model_candidate_catalog.py --json
          python -m unittest discover -s apps/server/tests -p test_model_candidate_catalog.py -v
      - name: Explain the bounds of the check
        run: |
          {
            echo "## Candidate metadata only"
            echo "No model downloaded, no ASR/MT executed, no glossary accuracy measured."
            echo "Licensed-for-research flag is based on cited model-card status, not independent legal advice."
            echo "A true glossary-ablation-wired flag does not imply correct semantic translation."
            echo "Field readiness remains false for every candidate."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-conveyor:
    needs: [metadata-check]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.source_sha != '' && github.repository == 'JDeun/LangTextFlow' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Resume research DAG on scientific stage completion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGE: catalog
        run: |
          set -euo pipefail
          python3 - <<'PY' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
          import json
          import os
          import re
          source = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[a-f0-9]{40}', source), 'invalid frozen SHA'
          print(json.dumps({
              'event_type': 'ltf-stage-finished',
              'client_payload': {'source_sha': source, 'stage': os.environ['STAGE']},
          }))
          PY
