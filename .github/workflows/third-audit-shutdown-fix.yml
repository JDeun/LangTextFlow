name: Third audit shutdown fix

on:
  push:
    branches:
      - hardening/third-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/third-audit
      - run: python scripts/third_audit_shutdown_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound shutdown across postprocess and ASR queues"
          git push origin HEAD:hardening/third-audit
