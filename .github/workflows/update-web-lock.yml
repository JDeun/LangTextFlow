name: Update web lockfile

on:
  push:
    branches: [hardening/assurance-pass-2]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Add exact Playwright test dependency and script
        working-directory: apps/web
        run: |
          npm pkg set 'scripts.test:e2e=playwright test'
          npm install --save-dev --save-exact @playwright/test@1.63.0
      - name: Commit synchronized package metadata
        run: |
          if git diff --quiet -- apps/web/package.json apps/web/package-lock.json; then
            echo "frontend lock metadata is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "test: lock Playwright browser test dependency"
          git push origin HEAD:${GITHUB_REF_NAME}
