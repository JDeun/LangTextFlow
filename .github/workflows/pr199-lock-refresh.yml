name: Temporary lock refresh (PR 199)
on:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/pr199-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/asr-fallback-session-candidate-fences-20261015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv lock --upgrade-package certifi --upgrade-package pypdf
      - run: uv sync --locked --extra dev
      - name: Commit refreshed lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(deps): refresh patched certifi and pypdf lock entries'
          git push origin HEAD:${{ github.head_ref }}
