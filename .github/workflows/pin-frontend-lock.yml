name: Pin frontend lockfile

on:
  push:
    branches:
      - hardening/release-readiness

permissions:
  contents: write

jobs:
  pin-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic frontend lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when missing or changed
        run: |
          if git diff --quiet -- apps/web/package-lock.json && git ls-files --error-unmatch apps/web/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build: pin frontend dependencies"
          git push
