name: Second audit apply

on:
  push:
    branches: [hardening/second-audit]

permissions:
  contents: write

concurrency:
  group: second-audit-apply
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[second-audit-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hardening/second-audit
      - uses: actions/setup-python@13c4551a7ae155362c9a2d2e0d0b55754e39c798 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Resolve uv bootstrap and apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          uv_version="$(uv --version | awk '{print $2}')"
          test -n "$uv_version"
          echo "Using uv $uv_version"
          python scripts/apply_second_audit.py --uv-version "$uv_version"
          uv lock
          cd apps/web
          npm install --package-lock-only --ignore-scripts
          cd ../..
          chmod +x scripts/run_browser_e2e.sh
          git diff --check
      - name: Commit generated lockfiles and hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "hardening: close second-audit gaps [second-audit-applied]"
          git push origin HEAD:hardening/second-audit
