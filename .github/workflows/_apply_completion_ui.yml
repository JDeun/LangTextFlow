name: Apply completion UI

on:
  push:
    branches: [feat/code-completion-pass]
    paths:
      - "scripts/_apply_completion_ui.py"
      - ".github/workflows/_apply_completion_ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/code-completion-pass
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python scripts/_apply_completion_ui.py
      - name: Commit UI integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate runtime maintenance and glossary suggestions"
          git push origin HEAD:feat/code-completion-pass
