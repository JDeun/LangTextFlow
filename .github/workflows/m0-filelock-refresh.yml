name: Refresh vulnerable filelock lock (one-shot)

on:
  push:
    branches:
      - fix/m0-filelock-lock-refresh-20261026
    paths:
      - .github/workflows/m0-filelock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.13"
      - name: Resolve fixed filelock and verify
        run: |
          set -euo pipefail
          uv lock --upgrade-package filelock
          uv sync --locked --extra dev
          uv pip check
          uv run pip-audit --format columns
          uv run pytest -q apps/server/tests/test_config.py apps/server/tests/test_runtime_lifecycle.py
      - name: Commit reproducible lock update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "No lockfile change produced"; exit 1
          fi
          git commit -m "fix(security): regenerate uv.lock with patched filelock"
          git push origin HEAD:fix/m0-filelock-lock-refresh-20261026
