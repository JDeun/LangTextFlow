name: Licensed FLEURS real-speech ASR (manual)

on:
  workflow_dispatch:
    inputs:
      language:
        description: Real-speech source language (independent test references)
        required: true
        type: choice
        options:
          - ko
          - en
      samples:
        description: Short FLEURS test samples (1-8)
        type: choice
        required: true
        default: "3"
        options:
          - "1"
          - "3"
          - "5"
          - "8"
      cpu_model:
        description: Faster-whisper model on standard CPU runner
        type: choice
        required: true
        default: tiny
        options:
          - tiny
          - base
          - small

permissions:
  contents: read

concurrency:
  group: licensed-fleurs-asr-${{ github.ref }}-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  real-speech-asr:
    name: FLEURS ${{ inputs.language }} (${{ inputs.cpu_model }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Locked app, CPU ASR and benchmark dependencies
        run: uv sync --locked --extra whisper --extra benchmark
      - name: Install pinned FLEURS streaming reader
        run: uv pip install "datasets==4.4.1" "soundfile==0.13.1"
      - name: Run real recorded speech against human-written test references
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          HF_HUB_DISABLE_TELEMETRY: "1"
          LANGTEXTFLOW_FASTER_WHISPER_DEVICE: cpu
          LANGTEXTFLOW_FASTER_WHISPER_COMPUTE_TYPE: int8
        run: |
          uv run --no-sync python scripts/evaluate_fleurs_asr.py \
            --language "${{ inputs.language }}" \
            --samples "${{ inputs.samples }}" \
            --model "${{ inputs.cpu_model }}" \
            --output artifacts/fleurs-asr
      - name: Print comparable metrics in job summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("artifacts/fleurs-asr/summary.json").read_text())
          lines = [
              "## FLEURS real speech ASR",
              "",
              f"- Dataset: google/fleurs @ `{payload['revision']}`, split=test, CC-BY-4.0",
              f"- Language: {payload['language']}",
              f"- Model: {payload['model']} (CPU int8)",
              f"- Samples: {payload['sample_count']}",
              f"- Mean CER: {payload['mean_cer']:.4f}",
              f"- Mean WER: {payload['mean_wer']:.4f}",
              f"- Mean throughput RTF: {payload['mean_throughput_rtf']:.4f}",
              "",
              "**Pilot only.** No verified field-quality thresholds or live GPU performance.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
      - name: Upload reports and attribution (no raw audio)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licensed-fleurs-asr-${{ inputs.language }}-${{ inputs.cpu_model }}
          path: |
            artifacts/fleurs-asr/summary.json
            artifacts/fleurs-asr/report-*.json
          if-no-files-found: warn
          retention-days: 14
