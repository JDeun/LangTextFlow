name: Generate Python lockfile

on:
  push:
    branches: [hardening/assurance-pass-2]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv resolver
        run: python -m pip install "uv==0.12.13"
      - name: Generate universal lock
        run: uv lock
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: lock Python dependencies with uv"
          git push origin HEAD:${GITHUB_REF_NAME}
