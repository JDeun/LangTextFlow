name: Apply code completion integration

on:
  push:
    branches: [feat/code-completion-pass]
    paths:
      - "scripts/_apply_code_completion_integration.py"
      - "scripts/_apply_code_completion_integration_v2.py"
      - ".github/workflows/_apply_code_completion_integration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/code-completion-pass
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Apply guarded patch
        run: python scripts/_apply_code_completion_integration_v2.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/langtextflow/main.py apps/server/langtextflow/model_setup.py apps/server/langtextflow/vibevoice_lifecycle.py apps/server/langtextflow/runtime_install.py
          if git diff --cached --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git commit -m "feat: integrate managed runtime provisioning APIs"
          git push origin HEAD:feat/code-completion-pass
