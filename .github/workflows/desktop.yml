name: Desktop Packaging

# Full Windows/macOS unsigned bundles are expensive release validation.
# PRs rely on the fast platform smoke jobs in ci.yml instead.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to validate (all by default)"
        type: choice
        options: [all, windows-latest, macos-latest]
        default: all
      native_m2m100_prepare:
        description: "Download/verify the fixed ~0.5 GB M2M100 cache and repair via frozen operator API"
        type: boolean
        default: false
      native_m2m100_import_probe:
        description: "Model-free frozen import-order/pipe-reader control matrix"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows-latest' && '["windows-latest"]' || inputs.platform == 'macos-latest' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned Rust toolchain
        if: ${{ !inputs.native_m2m100_import_probe || inputs.native_m2m100_prepare }}
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          test "$(rustc --version | awk '{print $2}')" = "1.90.0"
      - name: Install locked application dependencies
        shell: bash
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --locked --extra dev --extra whisper --extra local-mt
          uv pip install "pyinstaller==6.22.2"
          cd apps/web
          npm ci
          npm run build
      - name: Build Python backend sidecar
        run: uv run python scripts/build_desktop_sidecar.py
      - name: Smoke frozen backend lifecycle with disposable synthetic data
        env:
          LTF_M2M100_PREPARE_SMOKE: ${{ inputs.native_m2m100_prepare && '1' || '0' }}
          LTF_M2M100_IMPORT_PROBE: ${{ inputs.native_m2m100_import_probe && '1' || '0' }}
        run: uv run python scripts/smoke_desktop_sidecar.py
      - name: Upload explicit native setup receipt (no models/audio)
        if: always() && inputs.native_m2m100_prepare
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-m2m100-setup-${{ matrix.os }}
          path: artifacts/native-m2m100-setup-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload model-free import controls
        if: always() && inputs.native_m2m100_import_probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-m2m100-imports-${{ matrix.os }}
          path: artifacts/native-m2m100-import-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate platform icon assets
        if: ${{ !inputs.native_m2m100_import_probe || inputs.native_m2m100_prepare }}
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/logo.svg
      - name: Verify locked Rust desktop shell
        if: ${{ !inputs.native_m2m100_import_probe || inputs.native_m2m100_prepare }}
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          cargo check --locked
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Tauri's lib unit tests need the v6 controls manifest too (upstream #13419).
            export CARGO_ENCODED_RUSTFLAGS="$(printf '%s\037%s\037%s\037%s' \
              '-C' 'link-arg=/MANIFEST:EMBED' '-C' \
              "link-arg=/MANIFESTDEPENDENCY:type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'")"
          fi
          cargo test --locked --lib
      - name: Build unsigned desktop bundle
        if: ${{ !inputs.native_m2m100_import_probe || inputs.native_m2m100_prepare }}
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build
      - name: Upload desktop bundles
        if: ${{ !inputs.native_m2m100_import_probe || inputs.native_m2m100_prepare }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: langtextflow-${{ matrix.os }}-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
