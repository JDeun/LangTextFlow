name: Desktop Packaging

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/build_desktop_sidecar.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install locked application dependencies
        shell: bash
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --locked --extra dev --extra whisper
          uv pip install "pyinstaller==6.22.2"
          cd apps/web
          npm ci
          npm run build
      - name: Build Python backend sidecar
        run: uv run python scripts/build_desktop_sidecar.py
      - name: Generate platform icon assets
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/icon.png
      - name: Verify Rust desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Build unsigned desktop bundle
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build
      - name: Upload desktop bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: langtextflow-${{ matrix.os }}-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
