name: Apply VibeVoice fallback repair

on:
  push:
    branches: [feat/code-completion-pass]
    paths:
      - ".github/workflows/_fix_vibevoice_fallback.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/code-completion-pass
      - run: python scripts/_fix_vibevoice_fallback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/langtextflow/vibevoice_lifecycle.py
          git commit -m "fix: preserve prepared VibeVoice python fallback"
          git push origin HEAD:feat/code-completion-pass
