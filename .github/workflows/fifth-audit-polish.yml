name: Fifth audit stability polish

on:
  push:
    branches:
      - hardening/fifth-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/fifth-audit
          fetch-depth: 0
      - name: Apply polish
        run: python scripts/fifth_audit_polish.py
      - name: Validate
        run: |
          node apps/web/scripts/check-css-hygiene.mjs
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/OnboardingWizard.tsx apps/web/src/PreflightPanel.tsx apps/web/src/SessionHistory.tsx apps/web/src/productShell.css apps/web/tests/e2e-smoke.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize async UI flows and converge clean shell"
          git push origin HEAD:hardening/fifth-audit
