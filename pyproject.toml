[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langtextflow-server"
version = "0.2.0"
description = "Realtime multilingual caption pipeline for LangTextFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<18",
  "pypdf>=6.18,<7",
]

[project.optional-dependencies]
whisper = [
  "faster-whisper>=1.2.1,<2",
]
benchmark = [
  "psutil>=6,<8",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
langtextflow-benchmark = "langtextflow.benchmark:main"
langtextflow-runtime-benchmark = "langtextflow.runtime_benchmark:main"
langtextflow-translation-benchmark = "langtextflow.translation_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/server/langtextflow"]

[tool.pytest.ini_options]
pythonpath = ["apps/server"]
testpaths = ["apps/server/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["langtextflow"]
